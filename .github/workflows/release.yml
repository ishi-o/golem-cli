name: release

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/**'
      - 'CHANGELOG.md'
      - '.release-please-manifest.json'
      - 'release-please-config.json'
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/**'
      - 'CHANGELOG.md'
      - '.release-please-manifest.json'
      - 'release-please-config.json'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      - run: go build ./...
      - run: go test ./...

  release-version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_created: ${{ steps.release.outputs.release_created }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/setup-go
      - uses: googleapis/release-please-action@v4
        id: release

  build:
    needs: [test, release-version]
    if: needs.release-version.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
    env:
      VERSION: ${{ needs.release-version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      - name: Build
        run: |
          ext=""
          [ "${{ matrix.os }}" = "windows" ] && ext=".exe"
          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -trimpath -ldflags "-s -w -X github.com/yourname/golem/cmd.Version=${VERSION#v}" -o "golem${ext}" .
      - name: Package
        run: |
          ext=""
          [ "${{ matrix.os }}" = "windows" ] && ext=".exe"
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip "golem-${{ matrix.os }}-${{ matrix.arch }}.zip" "golem${ext}"
          else
            tar -czf "golem-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" "golem${ext}"
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: golem-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            golem-${{ matrix.os }}-${{ matrix.arch }}.zip
            golem-${{ matrix.os }}-${{ matrix.arch }}.tar.gz

  release:
    if: github.event_name == 'push'
    needs: [release-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Generate checksums
        run: |
          cd dist
          find . -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec sha256sum {} \; > checksums.txt
          mv checksums.txt ../
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-version.outputs.tag_name }}
        run: |
          pwd
          ls -la
          ls -la dist/
          gh release upload "$TAG" dist/**/*.zip dist/**/*.tar.gz checksums.txt --clobber
