version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-type: direct
    ignore:
      - dependency-name: github.com/ishi-o/golem/*
      - dependency-name: modernc.org/sqlite
        versions: ['>= 1.40.0']
      - dependency-name: go.opentelemetry.io/*
        versions: ['>= 1.39.0']
      - dependency-name: go.opentelemetry.io/contrib/*
        versions: ['>= 0.64.0']
      - dependency-name: google.golang.org/grpc
        versions: ['>= 1.76.0']
      - dependency-name: golang.org/x/*
        versions: ['>= 0.37.0']
      - dependency-name: k8s.io/*
      - dependency-name: k8s.io/kube-openapi
      - dependency-name: sigs.k8s.io/yaml
        versions: ['>= 1.5.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
